name: Deploy dh_message_sender

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USERNAME }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            echo "=== dh_message_sender ==="
            cd /home/m4ck-y/.me/dh/dh_message_sender
            git pull origin main
            /home/m4ck-y/.local/bin/uv sync --frozen
            sudo systemctl restart dh_message_sender
            sudo systemctl status dh_message_sender --no-pager